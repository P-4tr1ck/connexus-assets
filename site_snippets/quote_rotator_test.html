<div class="cxq" id="cxq-pathway" aria-roledescription="carousel" aria-label="In our students' words">
<style>
#cxq-pathway{box-sizing:border-box;max-width:1120px;margin:24px auto 48px;background:#F6F0E8;padding:36px 48px 30px;font-family:Institute,Connexus,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}
#cxq-pathway .cxq-eyebrow{color:#DA481D;font-size:14px;letter-spacing:3px;text-transform:uppercase;margin:0 0 30px;font-weight:500}
#cxq-pathway .cxq-stage{display:grid}
#cxq-pathway figure{grid-area:1/1;margin:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
#cxq-pathway figure.on{opacity:1;visibility:visible}
#cxq-pathway .cxq-mark{display:block;color:#DA481D;font-size:64px;line-height:.55;height:30px;font-family:Georgia,serif}
#cxq-pathway blockquote{margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;quotes:none;color:#133E67;font-size:22px;line-height:1.45;max-width:820px;font-style:normal}
#cxq-pathway blockquote p{background:transparent!important;margin:0;font-size:inherit;color:inherit;line-height:inherit}
#cxq-pathway figcaption{margin-top:14px;font-size:15px;color:#555}
#cxq-pathway figcaption b{color:#133E67;font-weight:500}
#cxq-pathway .cxq-dots{display:flex;gap:10px;margin-top:22px}
#cxq-pathway .cxq-dots button{all:unset;box-sizing:border-box;display:block;width:11px!important;height:11px!important;min-width:0!important;min-height:0!important;border-radius:50%!important;padding:0!important;margin:0!important;background:#d5cec1!important;cursor:pointer;font-size:0!important;line-height:0!important}
#cxq-pathway .cxq-dots button[aria-current="true"]{background:#DA481D!important}
#cxq-pathway .cxq-dots button:focus-visible{outline:2px solid #133E67;outline-offset:3px}
@media (max-width:700px){#cxq-pathway{padding:28px 22px 24px;margin:20px 16px 36px}#cxq-pathway blockquote{font-size:19px}#cxq-pathway .cxq-mark{font-size:56px;height:26px}}
@media (prefers-reduced-motion:reduce){#cxq-pathway figure{transition:none}}
#cxq-pathway .cxq-dots button::before,#cxq-pathway .cxq-dots button::after{content:none!important;display:none!important}
</style>
<p class="cxq-eyebrow">In our students’ words</p>
<div class="cxq-stage">
<figure class="on"><span class="cxq-mark" aria-hidden="true">“</span><blockquote><p>This sort of training requires the right people. Connexus has the right people.</p></blockquote><figcaption><b>Justin</b> · Stage One, 2025-26</figcaption></figure>
<figure><span class="cxq-mark" aria-hidden="true">“</span><blockquote><p>I started my training with Connexus wondering what therapist they wanted me to be. I finished my training realising I can be my authentic self, as this is what my clients will value.</p></blockquote><figcaption><b>Suzanne</b> · Stage Three, 2025-26</figcaption></figure>
<figure><span class="cxq-mark" aria-hidden="true">“</span><blockquote><p>I have learned an incredible amount in my first two years. It’s changed my career path and the way I approach life and all my relationships.</p></blockquote><figcaption><b>Ali</b> · Stage Two, 2025-26</figcaption></figure>
<figure><span class="cxq-mark" aria-hidden="true">“</span><blockquote><p>Connexus don’t just teach therapy, they prepare you holistically to be the best you can be in client work.</p></blockquote><figcaption><b>Scott</b> · Stage Three, 2025-26</figcaption></figure>
<figure><span class="cxq-mark" aria-hidden="true">“</span><blockquote><p>This has been the most fabulous course. I have felt so well looked after and wish I had been brave enough to start sooner.</p></blockquote><figcaption><b>Meg</b> · Stage One, 2025-26</figcaption></figure>
</div>
<div class="cxq-dots" role="group" aria-label="Choose a quote"></div>
<script>
(function(){
  var root=document.getElementById('cxq-pathway'); if(!root) return;
  var figs=root.querySelectorAll('figure'), dots=root.querySelector('.cxq-dots'), i=0, timer=null;
  var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(n){ figs[i].classList.remove('on'); dots.children[i].removeAttribute('aria-current');
    i=(n+figs.length)%figs.length; figs[i].classList.add('on'); dots.children[i].setAttribute('aria-current','true'); }
  figs.forEach(function(f,n){ var b=document.createElement('button'); b.type='button';
    b.setAttribute('aria-label','Quote '+(n+1)+' of '+figs.length);
    b.addEventListener('click',function(){ show(n); restart(); }); dots.appendChild(b); });
  dots.children[0].setAttribute('aria-current','true');
  function start(){ if(!still && !timer) timer=setInterval(function(){ show(i+1); },9000); }
  function stop(){ clearInterval(timer); timer=null; }
  function restart(){ stop(); start(); }
  root.addEventListener('mouseenter',stop); root.addEventListener('mouseleave',start);
  root.addEventListener('focusin',stop); root.addEventListener('focusout',start);
  start();
})();
</script>
</div>
